<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <!-- Importando Tailwind CSS para a estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- Cabeçalho -->
        <div class="bg-blue-600 p-6 text-center text-white">
            <h1 class="text-2xl font-bold mb-2">Calculadora da 4ª Unidade</h1>
            <p class="text-blue-100 text-sm">Descubra quanto você precisa tirar para atingir a média 7.0</p>
        </div>

        <!-- Formulário -->
        <div class="p-6 space-y-5">
            <!-- Novo Campo: Seleção de Matéria -->
            <div>
                <label for="materia" class="block text-sm font-medium text-gray-700 mb-1">
                    Matéria (Opcional)
                </label>
                <select id="materia" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-gray-700 bg-white">
                    <option value="" disabled selected>Selecione a matéria</option>
                    <option value="Biologia">Biologia</option>
                    <option value="Ed. Física">Ed. Física</option>
                    <option value="Filosofia">Filosofia</option>
                    <option value="Física">Física</option>
                    <option value="Geografia">Geografia</option>
                    <option value="História">História</option>
                    <option value="Inglês">Inglês</option>
                    <option value="Literatura">Literatura</option>
                    <option value="Matemática">Matemática</option>
                    <option value="Português">Português</option>
                    <option value="Prod. Textual">Prod. Textual</option>
                    <option value="Química">Química</option>
                    <option value="Sociologia">Sociologia</option>
                </select>
            </div>

            <div>
                <label for="media-semestre" class="block text-sm font-medium text-gray-700 mb-1">
                    Média do 1º Semestre
                </label>
                <input type="text" id="media-semestre" inputmode="decimal" placeholder="Ex: 7,5" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-gray-400 text-gray-700">
                <p class="text-xs text-gray-500 mt-1">Referente à 1ª e 2ª unidades</p>
            </div>

            <div>
                <label for="nota-3" class="block text-sm font-medium text-gray-700 mb-1">
                    Nota da 3ª Unidade
                </label>
                <input type="text" id="nota-3" inputmode="decimal" placeholder="Ex: 6,0" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder-gray-400 text-gray-700">
            </div>

            <!-- Botão de Calcular -->
            <button onclick="calcularNota()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-md hover:shadow-lg active:transform active:scale-[0.98]">
                Calcular Nota Necessária
            </button>
        </div>

        <!-- Área de Resultado (Oculta por padrão) -->
        <div id="resultado-container" class="hidden border-t border-gray-100 p-6">
            <div id="resultado-box" class="rounded-lg p-4 text-center">
                <span id="icone-resultado" class="text-4xl block mb-2"></span>
                <h3 id="titulo-resultado" class="text-lg font-bold mb-1"></h3>
                <p id="mensagem-resultado" class="text-sm"></p>
            </div>
        </div>
    </div>

    <script>
        function calcularNota() {
            // Pegando os valores digitados
            const inputMediaSemestre = document.getElementById('media-semestre').value;
            const inputNota3 = document.getElementById('nota-3').value;
            const materiaSelecionada = document.getElementById('materia').value;
            
            // Área de resultado e seus elementos internos
            const resultadoContainer = document.getElementById('resultado-container');
            const resultadoBox = document.getElementById('resultado-box');
            const iconeResultado = document.getElementById('icone-resultado');
            const tituloResultado = document.getElementById('titulo-resultado');
            const mensagemResultado = document.getElementById('mensagem-resultado');

            // Validação simples para ver se os campos de nota estão vazios
            if (inputMediaSemestre.trim() === '' || inputNota3.trim() === '') {
                alert("Por favor, preencha as notas para calcular.");
                return;
            }

            // Convertendo texto para número, trocando vírgula por ponto
            const mediaSemestre = parseFloat(inputMediaSemestre.replace(',', '.'));
            const nota3 = parseFloat(inputNota3.replace(',', '.'));

            if (isNaN(mediaSemestre) || isNaN(nota3)) {
                alert("Por favor, digite apenas números válidos.");
                return;
            }

            // Lógica principal
            const mediaAlvo = 7.0;
            const pontosTotaisNecessarios = mediaAlvo * 4;
            const pontosAcumulados = (mediaSemestre * 2) + nota3; 
            const nota4 = pontosTotaisNecessarios - pontosAcumulados;

            // Prepara textos de formatação
            const notaFormatada = nota4.toFixed(1).replace('.', ',');
            const nomeMateria = materiaSelecionada ? ` em ${materiaSelecionada}` : "";

            // Mostra a área de resultado e limpa classes antigas
            resultadoContainer.classList.remove('hidden');
            resultadoBox.classList.remove('bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-800', 'bg-blue-50', 'text-blue-800', 'text-blue-900');

            // Lógica de exibição das mensagens
            if (nota4 <= 0) {
                resultadoBox.classList.add('bg-green-50', 'text-green-800');
                iconeResultado.innerHTML = '🎉';
                tituloResultado.innerText = `Você já passou${nomeMateria}!`;
                mensagemResultado.innerText = 'Você já tem pontos suficientes. Mesmo tirando zero na 4ª unidade, sua média será maior que 7.';
            
            } else if (nota4 > 10) {
                resultadoBox.classList.add('bg-red-50', 'text-red-800');
                iconeResultado.innerHTML = '⚠️';
                tituloResultado.innerText = `Precisa de ${notaFormatada}${nomeMateria}`;
                mensagemResultado.innerText = 'Como a nota máxima é 10, sua situação é difícil. Você provavelmente precisará fazer recuperação.';
            
            } else {
                resultadoBox.classList.add('bg-blue-50', 'text-blue-900');
                iconeResultado.innerHTML = '🎯';
                tituloResultado.innerText = `Nota alvo${nomeMateria}: ${notaFormatada}`;
                mensagemResultado.innerText = 'Essa é a nota exata que você precisa tirar na 4ª unidade para fechar com média 7.';
            }
        }
    </script>
</body>
</html>
